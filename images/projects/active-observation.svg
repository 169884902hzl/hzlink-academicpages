<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="fovActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="occZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f4c81"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="10" fill="url(#panelBg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top Banner -->
  <rect x="20" y="18" width="760" height="44" rx="6" fill="#0f172a"/>
  <rect x="32" y="27" width="142" height="26" rx="4" fill="#166534"/>
  <text x="103" y="44" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#ffffff">IEEE CASE 2026</text>
  <text x="190" y="45" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Active Observation for Robust Visual Servoing under Occlusion</text>
  <text x="764" y="44" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">Paper ThCT6.3</text>

  <!-- Left Panel: Dual-Arm Active Observation Geometry -->
  <rect x="20" y="76" width="430" height="398" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="104" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">A. Dual-Arm Active Viewpoint &amp; Occlusion Avoidance</text>
  <line x1="36" y1="114" x2="434" y2="114" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Workspace Table -->
  <line x1="44" y1="415" x2="426" y2="415" stroke="#64748b" stroke-width="3"/>
  <rect x="44" y="415" width="382" height="16" fill="#f1f5f9"/>

  <!-- Occluded Static Camera Path (Red Cone) -->
  <polygon points="105,155 290,275 235,345" fill="url(#occZone)" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="160" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">Occlusion Cone Ω_occ</text>
  <text x="160" y="225" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">(Gripper blocks target)</text>

  <!-- Active Camera Optimal Trajectory Arc -->
  <path d="M 105,155 Q 205,112 305,152" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowCyan)"/>
  <text x="208" y="132" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#0369a1">Viewpoint Exploration q_cam*(t)</text>

  <!-- Unoccluded Active Camera FoV -->
  <polygon points="305,152 215,365 315,365" fill="url(#fovActive)" stroke="#0284c7" stroke-width="1.5"/>
  <text x="262" y="254" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#0369a1">Clear FoV</text>

  <!-- Left Arm: Active Camera Arm -->
  <path d="M 88,415 L 76,285 L 165,190 L 305,152" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="88" cy="415" r="9" fill="#0f172a"/>
  <circle cx="76" cy="285" r="7" fill="#0284c7"/>
  <circle cx="165" cy="190" r="7" fill="#0284c7"/>
  <!-- RGB-D Camera at (305, 152) -->
  <g transform="translate(305, 152) rotate(102)">
    <rect x="-12" y="-9" width="24" height="18" rx="3" fill="#0284c7" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="12,-6 21,-11 21,11 12,6" fill="#38bdf8" stroke="#0f172a" stroke-width="1.2"/>
  </g>
  <text x="372" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Active RGB-D</text>

  <!-- Right Arm: Grasping Arm -->
  <path d="M 382,415 L 392,295 L 285,295" fill="none" stroke="#0f4c81" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="382" cy="415" r="9" fill="#0f172a"/>
  <circle cx="392" cy="295" r="7.5" fill="#ffffff" stroke="#0f4c81" stroke-width="2.5"/>
  <!-- Gripper near target -->
  <g transform="translate(285, 295)">
    <path d="M 0,-15 L 0,15 M 0,-15 L -22,-15 M 0,15 L -22,15" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="352" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">Grasping Arm</text>

  <!-- Target Object on Table -->
  <rect x="236" y="345" width="38" height="70" rx="5" fill="#f59e0b" fill-opacity="0.25" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="255" cy="365" r="4.5" fill="#d97706"/>
  <text x="255" y="402" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#92400e">Target</text>

  <!-- Relative Vector Arrow between Gripper and Target -->
  <line x1="270" y1="305" x2="257" y2="357" stroke="#15803d" stroke-width="2.5" stroke-dasharray="3 2" marker-end="url(#arrowGreen)"/>
  <rect x="74" y="438" width="320" height="24" rx="4" fill="#f1f5f9"/>
  <text x="234" y="454" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#334155">Co-visibility preserved: Target &amp; Gripper in FoV</text>

  <!-- Right Panel: Two-Stage Strategy & Relative Visual Servoing Loop -->
  <rect x="466" y="76" width="314" height="398" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="484" y="104" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">B. Control Architecture</text>
  <line x1="482" y1="114" x2="764" y2="114" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Box 1: Two-Stage Viewpoint Strategy -->
  <rect x="486" y="128" width="274" height="76" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="500" y="149" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">1. Two-Stage Viewpoint Strategy</text>
  <text x="500" y="168" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Stage I: Global approach &amp; coarse alignment</text>
  <text x="500" y="186" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Stage II: Near-grasp co-visibility optimization</text>

  <line x1="623" y1="204" x2="623" y2="226" stroke="#0f4c81" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Box 2: Occlusion-Triggered Exploration -->
  <rect x="486" y="228" width="274" height="76" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="500" y="249" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">2. Occlusion-Triggered Exploration</text>
  <text x="500" y="268" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Real-time visibility ratio monitoring γ_vis(t)</text>
  <text x="500" y="286" font-family="Arial, sans-serif" font-size="11" fill="#334155">• Active camera repositioning upon mask drop</text>

  <line x1="623" y1="304" x2="623" y2="326" stroke="#0f4c81" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Box 3: Target-Gripper Relative Visual Servoing -->
  <rect x="486" y="328" width="274" height="86" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="500" y="349" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">3. Relative Visual Servoing (IBVS/PBVS)</text>
  <text x="500" y="369" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#166534">e_rel(t) = s_target(t) − s_gripper(t)</text>
  <text x="500" y="389" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#334155">v_g = −λ L_rel⁺ e_rel(t)  →  Robust Grasp</text>

  <!-- Footer summary in right panel -->
  <rect x="486" y="426" width="274" height="34" rx="5" fill="#0f172a"/>
  <text x="623" y="447" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#38bdf8">Closed-Loop Dual-Arm Coordination</text>
</svg>
