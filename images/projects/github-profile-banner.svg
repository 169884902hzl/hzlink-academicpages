    <text x="548" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#a78bfa">04 RECOVERY</text>
    <text x="548" y="43" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">HELIX Memory Loop</text>
