    <path d="M 75,58 L 65,-8 L 22,-15" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <rect x="-10" y="-14" width="20" height="20" rx="3" fill="#f59e0b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
    <text x="0" y="82" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#e2e8f0">SE(3) Closed-Loop</text>
