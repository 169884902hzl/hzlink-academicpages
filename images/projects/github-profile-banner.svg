  <text x="44" y="154" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#38bdf8">Reliable Robotic Manipulation via Closed-Loop Observation, Verification &amp; Adaptation</text>
  <text x="44" y="184" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">Ph.D. Student at Huazhong University of Science and Technology (HUST) · Advised by Prof. Weiming Shen</text>

