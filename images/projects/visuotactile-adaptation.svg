<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="tacForce" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1"/>
    </radialGradient>
    <marker id="arrVt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f4c81"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="10" fill="url(#bgVt)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Top Banner -->
  <rect x="20" y="18" width="760" height="44" rx="6" fill="#0f172a"/>
  <rect x="32" y="27" width="146" height="26" rx="4" fill="#0369a1"/>
  <text x="105" y="44" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#ffffff">T-REX / STICKS</text>
  <text x="194" y="45" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Visuotactile Policy Adaptation for Contact-Rich Manipulation</text>
  <text x="764" y="44" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">Ongoing Research</text>

  <!-- Left Column: Multimodal Sensing (Vision + Tactile Field) -->
  <rect x="20" y="76" width="250" height="398" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="36" y="104" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">1. Visuotactile Sensing</text>
  <line x1="36" y1="114" x2="254" y2="114" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Visual Stream Box -->
  <rect x="36" y="128" width="218" height="138" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="48" y="148" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Visual Observation o_t^vis</text>
  <!-- Peg-in-hole / Sticks illustration -->
  <rect x="122" y="162" width="26" height="58" rx="3" fill="#0284c7" stroke="#0f172a" stroke-width="1.5"/>
  <path d="M 90,224 L 120,224 L 120,252 L 150,252 L 150,224 L 180,224 L 180,256 L 90,256 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="145" y="156" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#334155">Sticks Insertion</text>

  <!-- Tactile Stream Box -->
  <rect x="36" y="280" width="218" height="176" rx="6" fill="#0f172a"/>
  <text x="48" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Tactile Force Field o_t^tac</text>
  <circle cx="145" cy="368" r="52" fill="url(#tacForce)" stroke="#475569" stroke-width="1"/>
  <!-- Tactile shear displacement arrows -->
  <g stroke="#f8fafc" stroke-width="1.5">
    <line x1="125" y1="350" x2="115" y2="338"/>
    <line x1="145" y1="345" x2="145" y2="328"/>
    <line x1="165" y1="350" x2="175" y2="338"/>
    <line x1="125" y1="375" x2="112" y2="375"/>
    <line x1="165" y1="375" x2="178" y2="375"/>
    <line x1="130" y1="395" x2="120" y2="408"/>
    <line x1="160" y1="395" x2="170" y2="408"/>
  </g>
  <text x="145" y="440" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#cbd5e1">Shear &amp; Normal Force F_tac</text>

  <!-- Center & Right: Policy Adaptation & Piper Robot Execution -->
  <rect x="286" y="76" width="494" height="398" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="304" y="104" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2. Cross-Modal Policy Adaptation &amp; Continuous Control (T-Rex Framework)</text>
  <line x1="304" y1="114" x2="762" y2="114" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Fusion Encoder -->
  <rect x="308" y="140" width="195" height="96" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="405" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Visuotactile Encoder</text>
  <text x="405" y="186" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#1d4ed8">z_t = Φ_enc(o_t^vis, o_t^tac)</text>
  <text x="405" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Contact state &amp; misalignment</text>
  <text x="405" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">representation learning</text>

  <line x1="503" y1="188" x2="545" y2="188" stroke="#0f4c81" stroke-width="2.5" marker-end="url(#arrVt)"/>

  <!-- RL Policy Module -->
  <rect x="548" y="140" width="212" height="96" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="654" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">RL Adaptive Policy π_θ</text>
  <text x="654" y="186" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#047857">a_t ~ π_θ(a_t | z_t, h_{t-1})</text>
  <text x="654" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Online residual adaptation</text>
  <text x="654" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">&amp; continuous action execution</text>

  <!-- Downward Arrow to Robot Hardware & Data Loop -->
  <line x1="654" y1="236" x2="654" y2="278" stroke="#0f4c81" stroke-width="2.5" marker-end="url(#arrVt)"/>

  <!-- Lower Box: Piper Robot Platform & Data Alignment Loop -->
  <rect x="308" y="282" width="452" height="174" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="328" y="308" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Piper Robot Hardware Integration &amp; Interaction Loop</text>

  <rect x="328" y="322" width="196" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="426" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f4c81">Continuous Action Execution</text>
  <text x="426" y="368" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#334155">Δx_t ∈ se(3),  f_cmd</text>
  <text x="426" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">High-frequency impedance</text>
  <text x="426" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">&amp; contact-rich alignment</text>

  <rect x="546" y="322" width="196" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="644" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">Synchronized Data Rollouts</text>
  <text x="644" y="368" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#334155">τ = {(o_t, a_t, r_t)}_{t=1}^T</text>
  <text x="644" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">Action-observation coupling</text>
  <text x="644" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">for iterative policy refinement</text>

  <line x1="524" y1="379" x2="544" y2="379" stroke="#0f4c81" stroke-width="2" marker-end="url(#arrVt)"/>
</svg>
