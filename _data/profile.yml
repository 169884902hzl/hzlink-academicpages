news:
  - date: "2026.06"
    badge: "IEEE CASE 2026"
    badge_color: "emerald"
    is_new: true
    text_en: "Our paper <strong>Active Observation for Robust Visual Servoing in Robotic Manipulation</strong> has been accepted to <strong>IEEE CASE 2026</strong> (Paper ThCT6.3, First Author)!"
    text_zh: "第一作者论文 <strong>Active Observation for Robust Visual Servoing in Robotic Manipulation</strong> 被机器人与自动化顶会 <strong>IEEE CASE 2026</strong> 接收（编号 ThCT6.3）！"
  - date: "2026.04"
    badge: "Preprint / Review"
    badge_color: "blue"
    is_new: true
    text_en: "Submitted our dual-arm deformable manipulation work <strong>VR-Loop: Iterative Verify-and-Refine Vision-Language Agent for Reliable Dual-Arm Manipulation</strong> (Second Author)."
    text_zh: "双臂柔性绳索操作研究 <strong>VR-Loop</strong> 完成投稿并进入审稿阶段（第二作者）。"
  - date: "2026.01"
    badge: "Ongoing Project"
    badge_color: "purple"
    is_new: false
    text_en: "Initiated two new research thrusts: <strong>T-Rex / Sticks</strong> (visuotactile policy adaptation on Piper robot) and <strong>HELIX</strong> (reflexive failure recovery &amp; episodic experience memory)."
    text_zh: "启动两项新研究方向：基于 Piper 机械臂的视触觉强化学习策略自适应（<strong>T-Rex / Sticks</strong>）与反射式故障恢复及经验记忆框架（<strong>HELIX</strong>）。"
  - date: "2025.09"
    badge: "Milestone"
    badge_color: "slate"
    is_new: false
    text_en: "Started my Ph.D. journey in Mechanical Engineering at <strong>Huazhong University of Science and Technology (HUST)</strong>, advised by <strong>Prof. Weiming Shen</strong>."
    text_zh: "进入<strong>华中科技大学机械科学与工程学院</strong>攻读博士学位，师从<strong>沈卫明教授</strong>。"

education:
  - period: "Present"
    degree_en: "Ph.D. Candidate in Mechanical Engineering (Robotics & Embodied AI)"
    degree_zh: "机械工程博士研究生（机器人与具身智能方向）"
    institution_en: "School of Mechanical Science and Engineering, Huazhong University of Science and Technology (HUST)"
    institution_zh: "华中科技大学 · 机械科学与工程学院"
    advisor_en: "Advisor: Prof. Weiming Shen (IEEE Fellow, Academician of CAE)"
    advisor_zh: "导师：沈卫明 教授（IEEE Fellow、中国工程院外籍院士、加拿大工程院院士）"
    focus_en: "Reliable Robotic Manipulation, Active Visual Servoing, Vision-Language Verification, Visuotactile RL, and Failure Recovery."

pillars:
  - id: "01"
    area: "Active perception"
    title: "Active Perception & Visual Servoing"
    title_zh: "主动感知与相对视觉伺服"
    desc: "Coordinating active eye-in-hand camera motion with target–gripper relative visual servoing to eliminate self-occlusion during grasping."
    tags: ["Dual-Arm Coordination", "IBVS / PBVS", "Occlusion Avoidance"]
  - id: "02"
    area: "Dual-arm manipulation"
    title: "Pre-Execution VLM Verification"
    title_zh: "执行前视觉语言闭环校验"
    desc: "Iterative visual-overlay action critique, topological knot reasoning, and mask-constrained 3D geometric projection for deformable objects."
    tags: ["Vision-Language Agent", "Deformable Rope", "Visual Overlay"]
  - id: "03"
    area: "Visuotactile learning"
    title: "Visuotactile Policy Adaptation"
    title_zh: "视触觉融合与强化学习自适应"
    desc: "Coupling global RGB context with local tactile shear/normal force fields to adapt continuous manipulation policies in contact-rich tasks."
    tags: ["Visuotactile Fusion", "Reinforcement Learning", "Piper Robot"]
  - id: "04"
    area: "Failure recovery"
    title: "Failure Recovery & Experience Memory"
    title_zh: "故障恢复与情景经验记忆"
    desc: "Monitoring online state-value transitions to trigger fast reflexive retraction and retrieve corrective rollouts from episodic memory."
    tags: ["Value Assessment", "Reflex Feedback", "Episodic Memory"]
